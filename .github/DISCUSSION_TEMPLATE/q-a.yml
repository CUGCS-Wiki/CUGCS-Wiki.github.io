title: "[问答] "
labels:
  - 问答
body:
  - type: markdown
    attributes:
      value: |
        感谢提问。请提供足够的背景和已经尝试过的方法，让回答者能够判断问题边界。公开讨论中请勿上传个人隐私、课程内部资料或未公开科研材料。

  - type: dropdown
    id: area
    attributes:
      label: 问题类型
      description: 选择最接近的主题，便于同学和维护者找到这个问题。
      options:
        - 课程学习
        - 竞赛训练
        - 科研与工程
        - 保研与升学
        - 校园学习生活
        - 其他
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: 背景与目标
      description: 说明问题发生的背景、你正在做什么，以及最终希望达到什么目标。
      placeholder: 例如课程名称、竞赛阶段、研究任务或申请年份。涉及个人经历时请先脱敏。
    validations:
      required: true

  - type: textarea
    id: attempts
    attributes:
      label: 已经尝试过什么
      description: 写出已经查阅的资料、尝试的方法和仍然困惑的地方，避免让回答者重复你的工作。
    validations:
      required: true

  - type: textarea
    id: expected-help
    attributes:
      label: 希望获得的帮助
      description: 尽量提出可以被明确回答的问题。需要引用政策或规则时，请附公开链接和核验日期。
    validations:
      required: true

  - type: checkboxes
    id: safety
    attributes:
      label: 发布前确认
      options:
        - label: 我已完成必要的脱敏，内容不含个人联系方式、成绩单、群聊截图、课程内部资料、未公开科研材料或其他受限信息。
          required: true
        - label: 我理解个人经验不等于普遍结论，并会说明其适用年份和背景。
          required: true
