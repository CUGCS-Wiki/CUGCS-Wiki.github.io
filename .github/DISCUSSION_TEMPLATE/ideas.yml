title: "[共建提案] "
labels:
  - 共建提案
  - 征集中
body:
  - type: markdown
    attributes:
      value: |
        共建提案用于把值得沉淀的主题逐步转化为 Wiki 内容。请不要只写“希望增加某某板块”，还要说明目标读者、已有资料、需要的帮助和完成标准。

  - type: dropdown
    id: area
    attributes:
      label: 所属模块
      options:
        - 课程学习
        - 竞赛资料
        - 科研经验
        - 保研经验
        - 跨模块或社区建设
    validations:
      required: true

  - type: textarea
    id: gap
    attributes:
      label: 当前缺少什么
      description: 说明现有 Wiki 或公开资料无法解决的问题，以及这个主题主要服务谁。
    validations:
      required: true

  - type: input
    id: target-page
    attributes:
      label: 拟新增或修改的位置
      description: 可以填写现有页面链接、建议路径，或者“需要共同确定”。
      placeholder: 例如 docs/courses/data-structures.md
    validations:
      required: true

  - type: textarea
    id: sources
    attributes:
      label: 已有资料与可核验来源
      description: 列出公开来源、本人有权分享的经验或仍需补充的证据。请说明哪些是事实、哪些是个人经验。
    validations:
      required: true

  - type: textarea
    id: collaboration
    attributes:
      label: 希望社区怎样参与
      description: 说明需要资料、案例、反例、写作者、评审者还是技术实现。
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: 完成标准与维护承诺
      description: 说明什么状态算完成、你愿意承担哪部分工作，以及后续是否愿意维护。
    validations:
      required: true

  - type: checkboxes
    id: safety
    attributes:
      label: 发布前确认
      options:
        - label: 我确认已有材料具备公开权限，不包含个人隐私、课程内部资料、未公开科研材料或受保密协议约束的信息。
          required: true
        - label: 如果连续 30 天没有实质进展，我接受其他成员在维护者确认后接手该提案。
          required: true
